<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C/C++ Code Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material-darker.min.css">
</head>
<body>
    <div id="app" class="editor-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">💻 C/C++ Editor</h1>
                <div class="header-actions">
                    <button id="compileBtn" class="btn btn-primary">
                        <span>⚙️ Compile</span>
                    </button>
                    <button id="runBtn" class="btn btn-success">
                        <span>▶️ Run</span>
                    </button>
                    <button id="newFileBtn" class="btn btn-secondary">
                        <span>📄 New</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar: File Manager -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Files</h2>
                    <button id="refreshBtn" class="btn-icon" title="Refresh">🔄</button>
                </div>
                <div id="fileTree" class="file-tree">
                    <div class="loading">Loading files...</div>
                </div>
            </aside>

            <!-- Editor Area -->
            <main class="editor-area">
                <div class="editor-tabs">
                    <div id="tabsContainer" class="tabs-container"></div>
                </div>

                <div class="editor-wrapper">
                    <textarea id="codeEditor"></textarea>
                </div>

                <!-- Bottom Panel: Output -->
                <div class="output-panel">
                    <div class="output-header">
                        <span class="output-title">Output</span>
                        <button id="clearOutputBtn" class="btn-icon" title="Clear">🗑️</button>
                    </div>
                    <div id="outputArea" class="output-area">
                        <p class="placeholder">Compile and run code to see output here...</p>
                    </div>
                    <div class="output-input">
                        <input type="text" id="programInput" placeholder="Program input (if needed)...">
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div id="newFileModal" class="modal">
        <div class="modal-content">
            <h2>New File</h2>
            <input type="text" id="newFileName" placeholder="filename.c or .cpp">
            <div class="modal-actions">
                <button id="createFileBtn" class="btn btn-primary">Create</button>
                <button id="cancelFileBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
    <script src="{{ url_for('static', filename='js/filemanager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/autocomplete.js') }}"></script>
    <script src="{{ url_for('static', filename='js/live-save.js') }}"></script>
</body>
</html>
